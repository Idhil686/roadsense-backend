<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoadSense — Accident Severity Predictor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --road:#2B5F8A;
    --road-dark:#1E4566;
    --panel:#FFFFFF;
    --panel-raised:#F3F4F6;
    --line:#DDE1E6;
    --lane:#F5B301;
    --text:#1C1F23;
    --muted:#6B7078;
    --green:#2E9E5B;
    --amber:#F5B301;
    --red:#E1432A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    background:linear-gradient(160deg, var(--road) 0%, var(--road-dark) 100%);
  }

  .lane-marking{
    height:8px;
    background-image: repeating-linear-gradient(90deg, var(--lane) 0px, var(--lane) 40px, transparent 40px, transparent 72px);
  }

  header{
    padding:34px 40px 28px;
  }
  header .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:2px;
    color:var(--lane);
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:8px;
  }
  header h1{
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    font-size:36px;
    margin:6px 0 6px;
    letter-spacing:0.5px;
    color:#FFFFFF;
  }
  header p{
    margin:0;
    color:rgba(255,255,255,0.82);
    font-size:14px;
    max-width:560px;
  }

  main{
    max-width:900px;
    margin:0 auto;
    padding:24px 40px 60px;
  }

  .report-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:30px 32px;
    box-shadow:0 14px 34px rgba(0,0,0,0.28);
  }

  .report-card .tag{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--muted);
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .report-card h2{
    font-family:'Rajdhani',sans-serif;
    font-weight:600;
    font-size:22px;
    margin:0 0 22px;
    color:var(--text);
  }

  .group{ margin-bottom:26px; }
  .group-label{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:#B5790A;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .group-label svg{ flex-shrink:0; }
  .group-label::after{
    content:'';
    flex:1;
    height:1px;
    background:var(--line);
  }

  .field-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:14px 16px;
  }
  @media (max-width:640px){ .field-grid{ grid-template-columns:1fr 1fr; } }

  .field label{
    display:block;
    font-size:11px;
    color:var(--muted);
    margin-bottom:5px;
    font-family:'JetBrains Mono',monospace;
    letter-spacing:0.3px;
  }
  .field input, .field select{
    width:100%;
    background:var(--panel-raised);
    border:1px solid var(--line);
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:13.5px;
    padding:9px 10px;
    border-radius:4px;
    outline:none;
  }
  .field input:focus, .field select:focus{ border-color:var(--road); }

  .checks{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .check{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--panel-raised);
    border:1px solid var(--line);
    padding:9px 14px;
    border-radius:20px;
    font-size:13px;
    color:var(--muted);
    cursor:pointer;
    user-select:none;
    transition:border-color .15s, color .15s;
  }
  .check input{ accent-color:var(--road); }
  .check.active{ border-color:var(--road); color:var(--text); }

  #predict-btn{
    width:100%;
    margin-top:8px;
    background:var(--road);
    color:#FFFFFF;
    border:none;
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    font-size:17px;
    letter-spacing:0.5px;
    padding:15px;
    border-radius:5px;
    cursor:pointer;
    transition:filter .15s;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  #predict-btn:hover{ filter:brightness(1.12); }
  #predict-btn svg{ flex-shrink:0; }

  #overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(20,22,25,0.6);
    justify-content:center;
    align-items:center;
    z-index:999;
    backdrop-filter:blur(2px);
  }
  #modal{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:34px 36px;
    width:340px;
    text-align:center;
    animation:pop .18s ease;
    box-shadow:0 10px 28px rgba(0,0,0,0.25);
  }
  @keyframes pop{ from{ transform:scale(0.94); opacity:0; } to{ transform:scale(1); opacity:1; } }

  #modal .tag{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:14px;
  }

  #gaugeSvg{ margin:0 auto; display:block; }

  #resultTitle{
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    font-size:22px;
    margin:14px 0 4px;
  }
  #resultConfidence{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    color:var(--muted);
    margin-bottom:22px;
  }

  #closeModal{
    width:100%;
    padding:11px;
    background:var(--panel-raised);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:5px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-size:14px;
  }
  #closeModal:hover{ border-color:var(--road); }
</style>
</head>
<body>

<header>
  <div class="eyebrow">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 L12 22 M2 12 L22 12"/></svg>
    Road Safety · Severity Prediction
  </div>
  <h1>RoadSense</h1>
  <p>Enter the conditions at the scene and get an instant severity estimate, trained on real US accident data.</p>
</header>
<div class="lane-marking"></div>

<main>
  <div class="report-card">
    <div class="tag">Incident Report</div>
    <h2>Scene Conditions</h2>

    <div class="group">
      <div class="group-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a3.5 3.5 0 0 0 0-7c-.16 0-.32.01-.48.04A5.5 5.5 0 0 0 6.5 13.06 4 4 0 0 0 7 21h10.5z"/><path d="M8 21v1M12 21v2M16 21v1"/></svg>
        Weather
      </div>
      <div class="field-grid">
        <div class="field"><label>Temperature (°F)</label><input id="temperature" type="number" value="60"></div>
        <div class="field"><label>Humidity (%)</label><input id="humidity" type="number" value="50"></div>
        <div class="field"><label>Visibility (mi)</label><input id="visibility" type="number" value="10"></div>
        <div class="field"><label>Wind Speed (mph)</label><input id="wind_speed" type="number" value="5"></div>
        <div class="field"><label>Precipitation (in)</label><input id="precipitation" type="number" value="0" step="0.1"></div>
        <div class="field">
          <label>Condition</label>
          <select id="weather_condition">
            <option>Clear</option><option>Cloudy</option><option>Rain</option>
            <option>Snow</option><option>Fog</option><option>Other</option>
          </select>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></svg>
        Time
      </div>
      <div class="field-grid">
        <div class="field"><label>Hour (0–23)</label><input id="hour" type="number" value="8"></div>
        <div class="field"><label>Day of Week (0=Mon)</label><input id="day_of_week" type="number" value="0"></div>
        <div class="field">
          <label>Light</label>
          <select id="sunrise_sunset"><option>Day</option><option>Night</option></select>
        </div>
      </div>
    </div>

    <div class="group">
      <div class="group-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 8 4h8l4 16"/><path d="M9 14h6M7 20h10"/></svg>
        Road Features
      </div>
      <div class="checks" id="road-toggles">
        <label class="check"><input type="checkbox" data-field="junction"> Junction</label>
        <label class="check"><input type="checkbox" data-field="crossing"> Crossing</label>
        <label class="check"><input type="checkbox" data-field="traffic_signal"> Traffic Signal</label>
      </div>
    </div>

    <button id="predict-btn" onclick="predict()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
      Predict Severity
    </button>
  </div>
</main>

<div id="overlay">
  <div id="modal">
    <div class="tag">Predicted Outcome</div>
    <svg id="gaugeSvg" viewBox="0 0 200 115" width="200" height="115">
      <path d="M 15 105 A 85 85 0 0 1 65 25"  fill="none" stroke="#2E9E5B" stroke-width="14" stroke-linecap="round"/>
      <path d="M 65 25 A 85 85 0 0 1 135 25"   fill="none" stroke="#F5B301" stroke-width="14" stroke-linecap="round"/>
      <path d="M 135 25 A 85 85 0 0 1 185 105" fill="none" stroke="#E1432A" stroke-width="14" stroke-linecap="round"/>
      <line id="needle" x1="100" y1="105" x2="100" y2="30" stroke="#1C1F23" stroke-width="3"/>
      <circle cx="100" cy="105" r="6" fill="#1C1F23"/>
    </svg>
    <div id="resultTitle">—</div>
    <div id="resultConfidence"></div>
    <button id="closeModal" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
document.querySelectorAll('#road-toggles input[type=checkbox]').forEach(cb => {
  cb.addEventListener('change', () => cb.closest('.check').classList.toggle('active', cb.checked));
});

const severityColor = { 1:'#2E9E5B', 2:'#F5B301', 3:'#F5B301', 4:'#E1432A' };
const needleAngle  = { 1:-70, 2:-22, 3:22, 4:70 };

async function predict() {
  const payload = {
    temperature: parseFloat(document.getElementById('temperature').value),
    humidity: parseFloat(document.getElementById('humidity').value),
    visibility: parseFloat(document.getElementById('visibility').value),
    wind_speed: parseFloat(document.getElementById('wind_speed').value),
    precipitation: parseFloat(document.getElementById('precipitation').value),
    weather_condition: document.getElementById('weather_condition').value,
    sunrise_sunset: document.getElementById('sunrise_sunset').value,
    hour: parseInt(document.getElementById('hour').value),
    day_of_week: parseInt(document.getElementById('day_of_week').value),
  };
  document.querySelectorAll('#road-toggles input[type=checkbox]').forEach(cb => {
    payload[cb.dataset.field] = cb.checked ? 1 : 0;
  });

  try {
    const res = await fetch('/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    const needle = document.getElementById('needle');
    const angle = needleAngle[data.severity] || 0;
    needle.setAttribute('transform', `rotate(${angle} 100 105)`);

    document.getElementById('resultTitle').textContent =
      `Severity ${data.severity} — ${data.severity_label}`;
    document.getElementById('resultTitle').style.color = severityColor[data.severity];
    document.getElementById('resultConfidence').textContent =
      `Model confidence: ${(data.confidence * 100).toFixed(1)}%`;

    document.getElementById('overlay').style.display = 'flex';
  } catch (e) {
    document.getElementById('resultTitle').textContent = 'Error';
    document.getElementById('resultTitle').style.color = '#E1432A';
    document.getElementById('resultConfidence').textContent =
      e.message + ' — is the Flask server running?';
    document.getElementById('overlay').style.display = 'flex';
  }
}

function closeModal() {
  document.getElementById('overlay').style.display = 'none';
}
</script>

</body>
</html>
